name: Back up closed pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: closed-pilot-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.PILOT_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pilot-backup
    env:
      PILOT_HOST: ${{ secrets.PILOT_HOST }}
      PILOT_USER: ${{ secrets.PILOT_USER }}
      PILOT_SSH_PRIVATE_KEY: ${{ secrets.PILOT_SSH_PRIVATE_KEY }}
      PILOT_HOST_KEY: ${{ secrets.PILOT_HOST_KEY }}
      PILOT_BACKUP_AGE_RECIPIENT: ${{ secrets.PILOT_BACKUP_AGE_RECIPIENT }}
      PILOT_DEPLOY_ROOT: ${{ vars.PILOT_DEPLOY_ROOT || '/opt/spanish-coach' }}

    steps:
      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PILOT_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PILOT_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$PILOT_DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$PILOT_DEPLOY_ROOT" != *..* ]]
          [[ "$PILOT_BACKUP_AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]]
          test -n "$PILOT_SSH_PRIVATE_KEY"
          test -n "$PILOT_HOST_KEY"

      - name: Configure pinned SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PILOT_SSH_PRIVATE_KEY" > ~/.ssh/id_pilot
          printf '%s\n' "$PILOT_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_pilot ~/.ssh/known_hosts

      - name: Stream database backup off the pilot host
        id: dump
        shell: bash
        run: |
          set -euo pipefail
          remote="$PILOT_USER@$PILOT_HOST"
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          filename="spanish-coach-$timestamp.dump"
          ssh -i ~/.ssh/id_pilot -o IdentitiesOnly=yes "$remote" \
            "cd '$PILOT_DEPLOY_ROOT/current' && docker compose --env-file .env.pilot -f compose.pilot.yaml exec -T postgres pg_dump --username=spanish_coach --dbname=spanish_coach --format=custom" \
            > "$filename"
          test -s "$filename"
          docker run --rm -i postgres:17-alpine pg_restore --list < "$filename" > backup-contents.txt
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "artifact=spanish-coach-backup-$timestamp" >> "$GITHUB_OUTPUT"

      - name: Encrypt backup for off-host retention
        env:
          BACKUP_FILE: ${{ steps.dump.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes age
          age --recipient "$PILOT_BACKUP_AGE_RECIPIENT" \
            --output "$BACKUP_FILE.age" "$BACKUP_FILE"
          sha256sum "$BACKUP_FILE.age" > "$BACKUP_FILE.age.sha256"
          rm -f "$BACKUP_FILE" backup-contents.txt

      - name: Retain encrypted backup off-host
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dump.outputs.artifact }}
          path: |
            ${{ steps.dump.outputs.filename }}.age
            ${{ steps.dump.outputs.filename }}.age.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove plaintext backup
        if: always()
        env:
          BACKUP_FILE: ${{ steps.dump.outputs.filename }}
        shell: bash
        run: rm -f "$BACKUP_FILE" backup-contents.txt
