name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://spanish_coach:spanish_coach@127.0.0.1:5432/spanish_coach
      APP_VERSION: ${{ github.sha }}
      DEPLOYMENT_VERSION: ${{ github.sha }}
      LOG_LEVEL: info
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: spanish_coach
          POSTGRES_USER: spanish_coach
          POSTGRES_PASSWORD: spanish_coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spanish_coach -d spanish_coach"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Validate pilot Compose
        env:
          POSTGRES_PASSWORD: ci-pilot-password
        run: docker compose -f compose.pilot.yaml config --quiet

      - name: Build closed-pilot image
        run: docker build --target runner --build-arg PILOT_VERSION="$APP_VERSION" --tag spanish-coach:ci .

      - name: Run container smoke test
        shell: bash
        run: |
          mkdir -p .logs
          docker run --detach --name spanish-coach-ci \
            --add-host host.docker.internal:host-gateway \
            --publish 127.0.0.1:3100:3000 \
            --env DATABASE_URL=postgres://spanish_coach:spanish_coach@host.docker.internal:5432/spanish_coach \
            --env APP_VERSION="$APP_VERSION" \
            spanish-coach:ci
          trap 'docker logs spanish-coach-ci > .logs/pilot-container.log 2>&1; docker rm --force spanish-coach-ci >/dev/null 2>&1 || true' EXIT
          SMOKE_BASE_URL=http://127.0.0.1:3100 npm run test:smoke

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-diagnostics
          path: |
            .logs/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
