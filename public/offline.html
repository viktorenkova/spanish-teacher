<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#7655e8" />
    <title>Spanish Coach · Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #fcfaf8; color: #173b37; }
      main { width: min(520px, 100%); padding: 28px; border-radius: 24px; background: white; box-shadow: 0 18px 50px rgba(23,59,55,.08); }
      span { color: #7655e8; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 8px 0 10px; font-family: Georgia, serif; font-size: 2rem; }
      p { margin: 0; color: #62706d; line-height: 1.65; }
      button { margin-top: 20px; border: 0; border-radius: 999px; padding: 13px 20px; background: #7655e8; color: white; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span>Spanish Coach</span>
      <h1>You are offline</h1>
      <p>Your saved learning data is safe. Reconnect to continue lessons, reviews, listening, and progress updates.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
