services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spanish_coach
      POSTGRES_USER: spanish_coach
      POSTGRES_PASSWORD: spanish_coach
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spanish_coach -d spanish_coach"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - spanish-coach-postgres:/var/lib/postgresql/data

volumes:
  spanish-coach-postgres:

